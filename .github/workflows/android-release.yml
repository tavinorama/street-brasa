name: Signed Android bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm run check && npx cap sync android
      - name: Load owner signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Configure the four Android signing secrets in mobile-release before running this workflow.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/brasa-release.jks"
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/brasa-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle-signed
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
      - if: always()
        run: rm -f "$RUNNER_TEMP/brasa-release.jks"
